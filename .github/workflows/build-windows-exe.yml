name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Validate source
        run: |
          python -m compileall -q src tests
          python -m pytest -q

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean LineSimulator.spec

      - name: Create SHA256
        shell: powershell
        run: |
          Get-FileHash "dist\Line Simulator v1.0.exe" -Algorithm SHA256 |
            Format-List |
            Out-File "dist\Line Simulator v1.0.sha256.txt" -Encoding utf8

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Line-Simulator-v1.0-Windows
          path: |
            dist/Line Simulator v1.0.exe
            dist/Line Simulator v1.0.sha256.txt
          if-no-files-found: error
